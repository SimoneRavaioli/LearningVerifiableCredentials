<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet v2 · Operator</title><link rel="stylesheet" href="/poc.css"></head><body><main><h1 id="title">Institution operator</h1><p>This is a separate service origin. Operator credentials are not sent to the learner wallet.</p><form id="login"><label for="password">Operator password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button></form><section id="controls" hidden><form id="issue" hidden><label for="holder">Learner’s public did:key</label><input id="holder" required><label for="name">Learner name</label><input id="name" value="Alex Morgan"><button>Issue credential offer</button></form><button id="request" hidden>Create employer request</button><button id="openid-offer" hidden>Create LearnCard wallet offer</button><button id="openid-request" hidden>Request evidence from LearnCard</button><p><a id="consumer-link" hidden target="_blank" rel="noopener noreferrer">Open in LearnCard wallet ↗</a></p><button id="close" hidden>Close issuer, retain historical authority</button><label id="output-label">Result / handoff</label><pre id="output"></pre><canvas id="qr" aria-label="Request handoff QR code"></canvas><p>Loopback links work on this machine only. Cross-device use needs configured HTTPS service origins and trusted requester identity.</p></section><p id="message" role="status"></p><p id="error" role="alert"></p></main><script type="module" src="/src/operator.mjs"></script></body></html>
